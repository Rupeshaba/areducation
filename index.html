<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="https://res.cloudinary.com/dhniudiwg/image/upload/v1783575514/logo_1_nnrpqg.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#6366f1" />
  <meta name="description" content="AR Education - Competitive Exam Preparation Platform" />
  <title>AR Education</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="manifest" href="/manifest.json" />
  <style>
    /* ── Static splash — paints before any JS runs, so refresh / PWA cold
       start never shows a blank white screen. React overwrites #root's
       contents the moment it mounts, so this needs no manual teardown. ── */
    #app-splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: #F7F8FC;
      background-image:
        radial-gradient(ellipse at 15% 0%, rgba(109, 94, 245, 0.10) 0%, transparent 55%),
        radial-gradient(ellipse at 90% 30%, rgba(45, 212, 191, 0.07) 0%, transparent 50%);
      font-family: 'Sora', system-ui, sans-serif;
    }
    #app-splash img {
      width: 76px;
      height: 76px;
      border-radius: 22px;
      box-shadow: 0 8px 28px rgba(109, 94, 245, 0.28);
      animation: app-splash-pulse 1.6s ease-in-out infinite;
    }
    #app-splash .app-splash-name {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.01em;
      color: #2A2073;
    }
    #app-splash .app-splash-bar {
      width: 120px;
      height: 4px;
      border-radius: 999px;
      background: rgba(109, 94, 245, 0.14);
      overflow: hidden;
    }
    #app-splash .app-splash-bar-fill {
      width: 40%;
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #8B7CFF, #6D5EF5);
      animation: app-splash-slide 1.1s ease-in-out infinite;
    }
    @keyframes app-splash-pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.06); opacity: 0.85; }
    }
    @keyframes app-splash-slide {
      0% { transform: translateX(-140%); }
      100% { transform: translateX(340%); }
    }
  </style>
</head>
<body>
  <div id="root">
    <div id="app-splash">
      <img src="/icon-192.png" width="76" height="76" alt="" />
      <div class="app-splash-name">AR Education</div>
      <div class="app-splash-bar"><div class="app-splash-bar-fill"></div></div>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
