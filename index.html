<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="https://res.cloudinary.com/dhniudiwg/image/upload/v1783575514/logo_1_nnrpqg.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#6366f1" />
  <meta name="description" content="AR Education - Competitive Exam Preparation Platform" />
  <title>AR Education</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="manifest" href="/manifest.json" />
  <style>
    /* ── Static splash — paints before any JS runs, so refresh / PWA cold
       start never shows a blank white screen.
       Timing (see inline script below):
         • First-ever visit  → stays up a MINIMUM of 3s (can run longer if
           the app genuinely isn't ready yet), full wave animation plays.
         • Every visit after → hides the instant the app signals ready,
           no artificial wait — behaves like a normal loader. ── */
    #app-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background:
        radial-gradient(ellipse at 50% 28%, rgba(109, 94, 245, 0.22) 0%, transparent 60%),
        radial-gradient(ellipse at 85% 80%, rgba(45, 212, 191, 0.10) 0%, transparent 55%),
        linear-gradient(180deg, #0B0E1A 0%, #12162A 100%);
      font-family: 'Sora', system-ui, sans-serif;
      opacity: 1;
      transition: opacity 0.45s ease;
    }
    #app-splash.app-splash-hide {
      opacity: 0;
      pointer-events: none;
    }
    .app-splash-mark {
      position: relative;
      width: 76px;
      height: 76px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .app-splash-mark .ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1.5px solid rgba(139, 124, 255, 0.55);
      opacity: 0;
      animation: app-splash-ring 2.4s cubic-bezier(0.2, 0.6, 0.4, 1) infinite;
    }
    .app-splash-mark .ring.r2 { animation-delay: 0.8s; }
    .app-splash-mark .ring.r3 { animation-delay: 1.6s; }
    .app-splash-mark img {
      position: relative;
      z-index: 1;
      width: 76px;
      height: 76px;
      border-radius: 22px;
      box-shadow: 0 0 32px rgba(139, 124, 255, 0.5);
      animation: app-splash-pulse 1.8s ease-in-out infinite;
    }
    .app-splash-name {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: #E4E0FD;
      opacity: 0;
      transform: translateY(8px);
      animation: app-splash-text-in 0.6s ease forwards 0.5s;
    }
    .app-splash-bar {
      width: 120px;
      height: 4px;
      border-radius: 999px;
      background: rgba(139, 124, 255, 0.18);
      overflow: hidden;
    }
    .app-splash-bar-fill {
      width: 40%;
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #8B7CFF, #5EEAD4);
      animation: app-splash-slide 1.1s ease-in-out infinite;
    }
    @keyframes app-splash-ring {
      0%   { transform: scale(1);   opacity: 0.6; border-color: rgba(139, 124, 255, 0.6); }
      70%  { opacity: 0.15; }
      100% { transform: scale(2.7); opacity: 0;   border-color: rgba(94, 234, 212, 0.4); }
    }
    @keyframes app-splash-pulse {
      0%, 100% { transform: scale(1);    opacity: 1; }
      50%      { transform: scale(1.06); opacity: 0.9; }
    }
    @keyframes app-splash-text-in {
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes app-splash-slide {
      0%   { transform: translateX(-140%); }
      100% { transform: translateX(340%); }
    }
  </style>
  <script>
    // ── Splash timing controller ─────────────────────────────────────
    // Runs before React exists. main.jsx calls window.__hideAppSplash()
    // once the first route has actually mounted and painted.
    (function () {
      var ENTERED_KEY = 'ar-edu-entered';
      var MIN_FIRST_VISIT_MS = 3000;
      var startedAt = Date.now();
      var hasEnteredBefore = localStorage.getItem(ENTERED_KEY) === '1';

      window.__hideAppSplash = function () {
        var run = function () {
          localStorage.setItem(ENTERED_KEY, '1');
          var el = document.getElementById('app-splash');
          if (!el) return;
          el.classList.add('app-splash-hide');
          setTimeout(function () { el.remove(); }, 450);
        };

        if (hasEnteredBefore) {
          // Repeat visit: no artificial wait, hide as soon as the app is ready.
          run();
        } else {
          // First-ever visit: enforce a 3s floor. If the app takes longer
          // than 3s to become ready, run() simply fires later — this is a
          // minimum, not a cap.
          var remaining = MIN_FIRST_VISIT_MS - (Date.now() - startedAt);
          setTimeout(run, remaining > 0 ? remaining : 0);
        }
      };
    })();
  </script>
</head>
<body>
  <div id="app-splash">
    <div class="app-splash-mark">
      <span class="ring r1"></span>
      <span class="ring r2"></span>
      <span class="ring r3"></span>
      <img src="/icon-192.png" width="76" height="76" alt="" />
    </div>
    <div class="app-splash-name">AR Education</div>
    <div class="app-splash-bar"><div class="app-splash-bar-fill"></div></div>
  </div>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
